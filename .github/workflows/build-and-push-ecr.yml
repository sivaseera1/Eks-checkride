name: CI-CD - Retail Order API to EKS

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: checkride/siva-p
  EKS_CLUSTER: eks-checkride-shared
  EKS_NAMESPACE: siva-p
  EKS_DEPLOYMENT: retail-order-api
  CONTAINER_NAME: app

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Python application
        run: python -m py_compile app/app.py

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Configure kubectl for Amazon EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy image to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl -n $EKS_NAMESPACE set image \
            deployment/$EKS_DEPLOYMENT \
            $CONTAINER_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Verify deployment rollout
        run: |
          kubectl -n $EKS_NAMESPACE rollout status \
            deployment/$EKS_DEPLOYMENT \
            --timeout=180s

      - name: Verify deployed application
        run: |
          kubectl -n $EKS_NAMESPACE get deployment $EKS_DEPLOYMENT
          kubectl -n $EKS_NAMESPACE get pods -l app=retail-order-api

